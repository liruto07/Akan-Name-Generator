<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="styles.css" />

    <!-- Confetti (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  </head>

  <body>
    <div class="background"></div>
    <div class="pattern"></div>

    <div class="container">
      <!-- IMAGE SECTION -->
      <div class="image-section">
        <!-- ✅ FIXED IMAGE PATH -->
        <img
          src="Heroes III – Hyperrealistic Unit Concepts.jpg"
          class="character"
          alt="African character"
        />
      </div>

      <!-- FORM SECTION -->
      <div class="form-section">
        <h1>Akan Name Generator</h1>
        <p>Discover your African name inspired by Ghanaian culture</p>

        <form id="akanForm">
          <input type="number" id="day" placeholder="Day (1-31)" required />

             <select id="month" required>
            <option value="">Select month</option>
            <option value="1">January</option>
            <option value="2">Febuary</option>
            <option value="3">March</option>
            <option value="4">April</option>
            <option value="5">May</option>
            <option value="6">June</option>
            <option value="7">July</option>
            <option value="8">August</option>
            <option value="9">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
          <input type="number" id="year" placeholder="Year" required />
          <select id="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>

          <button type="submit">Reveal my Name :)</button>
        </form>

        <!-- RESULT DISPLAY -->
        <div class="result">
          <h2 id="result"></h2>
        </div>
      </div>
    </div>

       <footer class="footer">
  <p>© 2026 Akan Name Generator | Built by Linda Ruto</p>
  <p>Inspired by Ghanaian culture 🇬🇭</p>
        </footer>
       

    <!-- CLOSED container properly -->

    <script src="script.js" defer></script>
  </body>
</html>
